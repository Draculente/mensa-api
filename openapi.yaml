openapi: "3.1.0"
info:
  title: "Meal API"
  version: "2.2.0"
paths:
  /meals:
    get:
      summary: "Get a list of meals"
      parameters:
        - name: date
          in: query
          description: "Filter by dates"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: location
          in: query
          description: "Filter by locations"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: language
          in: query
          description: "Filter by language codes"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: excludeAllergens
          in: query
          description: "List of allergen codes to exclude from the results"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: vegan
          in: query
          description: "Filter if the meals are vegan"
          required: false
          schema:
            type: boolean
        - name: vegetarian
          in: query
          description: "Filter if the meals are vegetarian"
          required: false
          schema:
            type: boolean
        - name: organic
          in: query
          description: "Filter if the meals are organic. E.g. contains_pork=false returns only meals without pork"
          required: false
          schema:
            type: boolean
        - name: contains_pork
          in: query
          description: "Filter if the meals contain pork. E.g. contains_pork=false returns only meals without pork"
          required: false
          schema:
            type: boolean
        - name: contains_beef
          in: query
          description: "Filter if the meals contain beef. E.g. contains_pork=false returns only meals without pork"
          required: false
          schema:
            type: boolean
        - name: contains_poultry
          in: query
          description: "Filter if the meals contain poultry. E.g. contains_pork=false returns only meals without pork"
          required: false
          schema:
            type: boolean
        - name: contains_alcohol
          in: query
          description: "Filter if the meals contain alcohol. E.g. contains_pork=false returns only meals without pork"
          required: false
          schema:
            type: boolean
        - name: schleswig_holstein_plate
          in: query
          description: "Filter if the meals are marked as Schleswig-Holstein plate. E.g. contains_pork=false returns only meals without pork"
          required: false
          schema:
            type: boolean
        - name: streetfood
          in: query
          description: "Filter if the meals are marked as streetfood. E.g. contains_pork=false returns only meals without pork"
          required: false
          schema:
            type: boolean
        - name: max_co2_grams
          in: query
          description: "Maximum CO2 emissions in grams. Meals without CO2 information are excluded"
          required: false
          schema:
            type: integer
        - name: min_co2_score
          in: query
          description: "Minimum CO2 score (1 to 3 leaves, 3 is best). Meals without CO2 information are excluded"
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  last_updated:
                    type: "string"
                    description: "ISO Date of the last scrape from the website in UTC"
                  data:
                    type: array
                    items:
                      type: "object"
                      properties:
                        date:
                          type: "string"
                          description: "ISO Date (without time). E.g.: 2025-09-24"
                        name:
                          type: "string"
                        vegan:
                          type: "boolean"
                        price:
                          type: "object"
                          properties:
                            students:
                              type: "number"
                            employees:
                              type: "number"
                            guests:
                              type: "number"
                        vegetarian:
                          type: "boolean"
                        co2_grams:
                          type: "integer"
                          nullable: true
                          description: "Estimated CO2 emissions of the meal in grams"
                        co2_score:
                          type: "integer"
                          nullable: true
                          minimum: 1
                          maximum: 3
                          description: "CO2 score of the Studentenwerk as number of leaves (3 is best)"
                        dietary_preferences:
                          type: "object"
                          description: "Dietary markers from the website. There is no halal information; the contains_* flags are no guarantee for a halal meal."
                          properties:
                            organic:
                              type: "boolean"
                            contains_pork:
                              type: "boolean"
                            contains_beef:
                              type: "boolean"
                            contains_poultry:
                              type: "boolean"
                            contains_alcohol:
                              type: "boolean"
                            schleswig_holstein_plate:
                              type: "boolean"
                            streetfood:
                              type: "boolean"
                        location:
                          type: object
                          properties:
                            name:
                              type: "string"
                            code:
                              type: "string"
                            city:
                              type: "string"
                        allergens:
                          type: "array"
                          items:
                            type: "object"
                            properties:
                              code:
                                type: "string"
                              name:
                                type: "string"
                        language: 
                          type: "object"
                          properties:
                            code: 
                              type: "string"
                              description: "The ISO 639 language code"
                            name: 
                              type: "string"
                              description: "The native name of the language"

  /allergens:
    get:
      summary: "Get a list of allergens"
      parameters:
        - name: code
          in: query
          description: "Filter by allergen codes"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: name
          in: query
          description: "Filter by allergen names"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: language
          in: query
          description: "Filter by language codes"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: location
          in: query
          description: "Filter by locations"
          required: true
          schema:
            type: "array"
            items:
              type: "string"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  last_updated:
                    type: "string"
                  data:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        code:
                          type: "string"
                        name:
                          type: "string"
                        language: 
                          type: "object"
                          properties:
                            code: 
                              type: "string"
                              description: "The ISO 639 language code"
                            name: 
                              type: "string"
                              description: "The native name of the language"

  /locations:
    get:
      summary: "Get a list of locations"
      parameters:
        - name: code
          in: query
          description: "Filter by location codes"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: city
          in: query
          description: "Filter by city"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: name
          in: query
          description: "Filter by location names"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  last_updated:
                    type: "string"
                  data:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        code:
                          type: "string"
                        name:
                          type: "string"
                        city:
                          type: "string"
                        available_languages:
                          type: "object"
                          properties:
                            code: 
                              type: "string"
                              description: "The ISO 639 language code"
                            name: 
                              type: "string"
                              description: "The native name of the language"
